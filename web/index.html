<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XoNet — Analyse de Sentiment Fongbé</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --card-border: #dbeafe;
            --border-subtle: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
            --accent-light: rgba(29, 78, 216, 0.10);
            --accent-soft: #eff6ff;
            --positive-color: #16a34a;
            --neutral-color: #eab308;
            --neutral-text: #a16207;
            --negative-color: #dc2626;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 45%, #ffffff 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            border: 1px solid #bfdbfe;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 26px 28px;
            box-shadow: 0 12px 30px -8px rgba(29, 78, 216, 0.08), 0 4px 10px -4px rgba(15, 23, 42, 0.04);
        }

        .card-topbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 16px;
        }

        .model-picker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .model-picker label {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .model-select {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--accent-soft);
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 6px 10px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .model-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        /* Clavier de raccourcis Fongbé */
        .fon-char-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .char-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-btn:hover {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        textarea {
            width: 100%;
            height: 108px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .examples {
            margin-bottom: 20px;
        }

        .examples-title {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .examples-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .example-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            padding: 6px 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .example-chip:hover {
            background: var(--accent-soft);
            border-color: #93c5fd;
            color: var(--accent-hover);
        }

        .example-chip .chip-fr {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-pos { background: var(--positive-color); }
        .dot-neu { background: var(--neutral-color); }
        .dot-neg { background: var(--negative-color); }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 15.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px -2px rgba(29, 78, 216, 0.25);
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px -2px rgba(29, 78, 216, 0.32);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Résultat */
        .result-container {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid var(--border-subtle);
            display: none;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .sentiment-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 700;
        }

        .result-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .confidence-tag {
            font-size: 13.5px;
            color: var(--text-primary);
            font-weight: 700;
            cursor: help;
        }

        .model-tag {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Barres de probabilités */
        .probs-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .prob-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .prob-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }

        .prob-bar-bg {
            width: 100%;
            height: 9px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .prob-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        /* Error state */
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }

        @media (max-width: 520px) {
            .card {
                padding: 20px 18px;
            }
            .card-topbar {
                justify-content: flex-start;
            }
            .result-meta {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge-brand">
                <span class="badge-dot"></span>
                <span>XoNet</span>
            </div>
            <h1>Analyse de Sentiment Fongbé</h1>
            <p>Évaluez instantanément la tonalité d'un texte en langue fon.</p>
        </div>

        <div class="card">
            <div class="card-topbar">
                <div class="model-picker">
                    <label for="modelSelect">Modèle :</label>
                    <select id="modelSelect" class="model-select" aria-label="Sélection du modèle" title="Sélectionner le moteur d'analyse">
                        <option value="v3_tuned">SVM Hybride v3 (Char+Word) (75.4%)</option>
                        <option value="soft_voting">Soft Voting (MNB + Random Forest) (71.9%)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <span class="field-label">Caractères spéciaux :</span>
                <div class="fon-char-bar">
                    <button type="button" class="char-btn" onclick="insertChar('ɛ')" title="Insérer ɛ">ɛ</button>
                    <button type="button" class="char-btn" onclick="insertChar('ɔ')" title="Insérer ɔ">ɔ</button>
                    <button type="button" class="char-btn" onclick="insertChar('ɖ')" title="Insérer ɖ">ɖ</button>
                    <button type="button" class="char-btn" onclick="insertChar('ɣ')" title="Insérer ɣ">ɣ</button>
                    <button type="button" class="char-btn" onclick="insertChar('ɲ')" title="Insérer ɲ">ɲ</button>
                    <button type="button" class="char-btn" onclick="insertChar('Ɛ')" title="Insérer Ɛ">Ɛ</button>
                    <button type="button" class="char-btn" onclick="insertChar('Ɔ')" title="Insérer Ɔ">Ɔ</button>
                    <button type="button" class="char-btn" onclick="insertChar('Ɖ')" title="Insérer Ɖ">Ɖ</button>
                </div>

                <textarea id="inputText" placeholder="Saisissez votre texte en fongbé..." autofocus></textarea>
            </div>

            <div class="examples">
                <span class="examples-title">Exemples :</span>
                <div class="examples-grid">
                    <button type="button" class="example-chip" data-text="A ɖò ganji" onclick="setExample(this.dataset.text)" title="Exemple Positif">
                        <span class="dot dot-pos"></span>
                        <span>A ɖò ganji</span>
                        <span class="chip-fr">(Ça va bien)</span>
                    </button>
                    <button type="button" class="example-chip" data-text="Nùɖúɖú élɔ víví ɖeji" onclick="setExample(this.dataset.text)" title="Exemple Positif">
                        <span class="dot dot-pos"></span>
                        <span>Nùɖúɖú élɔ víví ɖeji</span>
                        <span class="chip-fr">(Ce repas est délicieux)</span>
                    </button>
                    <button type="button" class="example-chip" data-text="Xwe nabi a ɖo?" onclick="setExample(this.dataset.text)" title="Exemple Neutre">
                        <span class="dot dot-neu"></span>
                        <span>Xwe nabi a ɖo?</span>
                        <span class="chip-fr">(Quel âge as-tu ?)</span>
                    </button>
                    <button type="button" class="example-chip" data-text="sɔ̀ nù énɛ́ yì xwé" onclick="setExample(this.dataset.text)" title="Exemple Neutre">
                        <span class="dot dot-neu"></span>
                        <span>sɔ̀ nù énɛ́ yì xwé</span>
                        <span class="chip-fr">(Remmène cela chez toi)</span>
                    </button>
                    <button type="button" class="example-chip" data-text="a nɔ bló nŭ gidigidì" onclick="setExample(this.dataset.text)" title="Exemple Négatif">
                        <span class="dot dot-neg"></span>
                        <span>a nɔ bló nŭ gidigidì</span>
                        <span class="chip-fr">(Tu agis brutalement)</span>
                    </button>
                    <button type="button" class="example-chip" data-text="mɛ atɔn gble wu" onclick="setExample(this.dataset.text)" title="Exemple Négatif">
                        <span class="dot dot-neg"></span>
                        <span>mɛ atɔn gble wu</span>
                        <span class="chip-fr">(Trois blessés)</span>
                    </button>
                </div>
            </div>

            <button id="btnPredict" class="btn-submit" onclick="predictSentiment()">
                <span>Analyser</span>
            </button>

            <div id="errorMsg" class="error-msg"></div>

            <div id="resultContainer" class="result-container">
                <div class="result-header">
                    <div id="sentimentBadge" class="sentiment-badge">
                        <span id="badgeDot" class="dot"></span>
                        <span id="badgeName">Neutre</span>
                    </div>
                    <div class="result-meta">
                        <span id="confidenceTag" class="confidence-tag" title="Score après correction du biais vers Neutre (pas une probabilité brute)">Score : --%</span>
                        <span id="activeModelTag" class="model-tag">Modèle : --</span>
                    </div>
                </div>

                <div class="probs-list">
                    <div class="prob-item">
                        <div class="prob-label-row">
                            <span style="color: #16a34a;">Positif</span>
                            <span id="valPositif" style="color: #16a34a;">0%</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div id="barPositif" class="prob-bar-fill" style="width: 0%; background: #16a34a;"></div>
                        </div>
                    </div>

                    <div class="prob-item">
                        <div class="prob-label-row">
                            <span style="color: #a16207;">Neutre</span>
                            <span id="valNeutre" style="color: #a16207;">0%</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div id="barNeutre" class="prob-bar-fill" style="width: 0%; background: #eab308;"></div>
                        </div>
                    </div>

                    <div class="prob-item">
                        <div class="prob-label-row">
                            <span style="color: #dc2626;">Négatif</span>
                            <span id="valNegatif" style="color: #dc2626;">0%</span>
                        </div>
                        <div class="prob-bar-bg">
                            <div id="barNegatif" class="prob-bar-fill" style="width: 0%; background: #dc2626;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadAvailableModels() {
            const select = document.getElementById('modelSelect');
            try {
                const res = await fetch('/api/models');
                if (!res.ok) return;
                const data = await res.json();
                if (!Array.isArray(data.models) || data.models.length === 0) return;

                select.innerHTML = '';
                for (const m of data.models) {
                    const option = document.createElement('option');
                    option.value = m.key;
                    option.textContent = `${m.label} (${m.accuracy})`;
                    if (m.key === data.default_model) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }
            } catch (_) {
                // Keep static fallback options if offline/unavailable
            }
        }

        function insertChar(char) {
            const textarea = document.getElementById('inputText');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + char + text.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + char.length;
        }

        function setExample(text) {
            document.getElementById('inputText').value = text;
            predictSentiment();
        }

        async function predictSentiment() {
            const text = document.getElementById('inputText').value.trim();
            const modelKey = document.getElementById('modelSelect').value;
            const btn = document.getElementById('btnPredict');
            const errorMsg = document.getElementById('errorMsg');
            const resultContainer = document.getElementById('resultContainer');

            errorMsg.style.display = 'none';

            if (!text) {
                errorMsg.innerText = 'Veuillez saisir un texte en fon.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Analyse en cours...</span>';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_key: modelKey })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erreur lors de la prédiction.');
                }

                const badge = document.getElementById('sentimentBadge');
                const badgeDot = document.getElementById('badgeDot');
                document.getElementById('badgeName').innerText = data.sentiment;

                if (data.sentiment === 'Positif') {
                    badge.style.background = '#f0fdf4';
                    badge.style.color = '#16a34a';
                    badge.style.border = '1px solid #bbf7d0';
                    badgeDot.style.background = '#16a34a';
                } else if (data.sentiment === 'Négatif') {
                    badge.style.background = '#fef2f2';
                    badge.style.color = '#dc2626';
                    badge.style.border = '1px solid #fecaca';
                    badgeDot.style.background = '#dc2626';
                } else {
                    badge.style.background = '#fefce8';
                    badge.style.color = '#a16207';
                    badge.style.border = '1px solid #fde047';
                    badgeDot.style.background = '#eab308';
                }

                const confTag = document.getElementById('confidenceTag');
                if (typeof data.confidence === 'number') {
                    confTag.innerText = `Score : ${(data.confidence * 100).toFixed(1)}%`;
                } else {
                    confTag.innerText = 'Score : --';
                }

                document.getElementById('activeModelTag').innerText =
                    `Modèle : ${data.model_label || modelKey}`;

                if (data.probabilities) {
                    const pPos = (data.probabilities.Positif * 100) || 0;
                    const pNeu = (data.probabilities.Neutre * 100) || 0;
                    const pNeg = (data.probabilities['Négatif'] * 100) || 0;

                    document.getElementById('valPositif').innerText = `${pPos.toFixed(1)}%`;
                    document.getElementById('barPositif').style.width = `${pPos}%`;

                    document.getElementById('valNeutre').innerText = `${pNeu.toFixed(1)}%`;
                    document.getElementById('barNeutre').style.width = `${pNeu}%`;

                    document.getElementById('valNegatif').innerText = `${pNeg.toFixed(1)}%`;
                    document.getElementById('barNegatif').style.width = `${pNeg}%`;
                }

                resultContainer.style.display = 'block';
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Analyser</span>';
            }
        }

        document.getElementById('modelSelect').addEventListener('change', function() {
            const text = document.getElementById('inputText').value.trim();
            if (text) {
                predictSentiment();
            }
        });

        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                predictSentiment();
            }
        });

        document.addEventListener('DOMContentLoaded', loadAvailableModels);
    </script>
</body>
</html>
